name: Engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Independent engine tests
        run: cargo test --locked
      - name: Absent, invalid, and incomplete Book experiments
        run: scripts/check-engine-independence.sh
      - name: Current Book acceptance
        run: cargo test --locked --test current_book -- --ignored
