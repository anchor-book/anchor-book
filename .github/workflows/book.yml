name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.2"
  MDBOOK_MERMAID_VERSION: "0.17.0"

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mdBook
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --silent --show-error --location \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Install diagram support
        run: |
          cargo install mdbook-mermaid --version "$MDBOOK_MERMAID_VERSION" --locked
          mdbook-mermaid install .

      - name: Build Book
        run: |
          mdbook --version
          mdbook build

      - name: Retain rendered Book
        uses: actions/upload-artifact@v4
        with:
          name: anchor-book
          path: target/anchorbook/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/anchorbook/

  deploy:
    name: Publish Book
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Book
        id: deployment
        uses: actions/deploy-pages@v4
