name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mdBook
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --silent --show-error --location \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build Book
        run: |
          mdbook --version
          mdbook build

      - name: Retain rendered Book
        uses: actions/upload-artifact@v4
        with:
          name: anchor-book
          path: book/
          if-no-files-found: error
          retention-days: 14
