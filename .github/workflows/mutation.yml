name: Mutation testing

# Run on every PR so a required check is never absent due to a path filter.
# PRs and main pushes without mutation inputs pass without a campaign.
# A PR mutates only the lines it changes; descriptive manifest metadata is ignored.
# Build-affecting manifest values, mutation machinery, and toolchain changes run
# the full campaign, as do relevant main pushes and all manual runs.
# Every campaign is split into four shards that together test each mutation once;
# the "Mutation tests" job, the required check, passes only when every shard does.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a full campaign on main always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Mutation scope
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Test mutation scope selection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*scope.py'
      - name: Detect code changes
        id: scope
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 -B .github/scripts/ci_scope.py mutation >> "$GITHUB_OUTPUT"

  shard:
    name: Mutation shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Ordinary tests
        run: cargo +stable test --locked
      - name: Install cargo-mutants
        run: cargo +stable install cargo-mutants --version 27.1.0 --locked
      - name: Test mutations in changed lines
        if: needs.scope.outputs.scope == 'diff'
        run: |
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          cargo +stable mutants --jobs 4 --build-timeout 120 --in-diff "$RUNNER_TEMP/pr.diff" --shard ${{ matrix.shard }}/4
      - name: Test all mutations
        if: needs.scope.outputs.scope == 'full'
        run: cargo +stable mutants --jobs 4 --build-timeout 120 --shard ${{ matrix.shard }}/4
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-${{ matrix.shard }}
          # Deliberately omit lock.json and debug.log (host/process metadata).
          path: |
            target/mutants.out/outcomes.json
            target/mutants.out/mutants.json
            target/mutants.out/*.txt
            target/mutants.out/log/
            target/mutants.out/diff/
          if-no-files-found: warn
          retention-days: 14

  mutation:
    name: Mutation tests
    needs: [scope, shard]
    # Always report, so a failed or cancelled shard fails this required check
    # instead of leaving it skipped.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard to pass
        run: |
          echo "scope: ${{ needs.scope.result }} (${{ needs.scope.outputs.scope || 'none' }}); shards: ${{ needs.shard.result }}"
          test "${{ needs.scope.result }}" = success
          case "${{ needs.scope.outputs.code }}:${{ needs.scope.outputs.scope }}" in
            false:none) test "${{ needs.shard.result }}" = skipped ;;
            true:diff|true:full) test "${{ needs.shard.result }}" = success ;;
            *) exit 1 ;;
          esac
