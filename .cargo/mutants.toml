# Run independent tests against temporary source copies; keep the Book acceptance
# test separate. No engine files are excluded.
additional_cargo_args = ["--locked"]
gitignore = true
output = "target"
timeout_multiplier = 5.0
minimum_test_timeout = 30.0

exclude_re = [
    # Reviewed equivalent mutation: `i + 1` to `i * 1` in a code block's line start
    # makes its range begin at the previous line's newline, so only an empty
    # previous line also counts as code, and an empty line is never part of a
    # record. Re-review when this expression changes.
    '^src/records/lines\.rs:110:81: replace \+ with \* in code_blocks$',
    # Loop counters in the verified authority functions: `+= 1` to `*= 1` leaves the
    # index at 0, so the loop never ends and tests can only time out. Termination is
    # proved instead: each loop's `decreases` clause rejects these changes under
    # `cargo verus verify --features verus`. Re-review when these loops change.
    '^src/records/authority\.rs:279:25: replace \+= with \*= in lookup$',
    '^src/records/authority\.rs:305:25: replace \+= with \*= in has_unknown_identity$',
    '^src/records/authority\.rs:344:33: replace \+= with \*= in validate_reference$',
    '^src/records/authority\.rs:437:33: replace \+= with \*= in validate_authorities$',
    '^src/records/authority\.rs:440:22: replace \+= with \*= in validate_authorities$',
]
