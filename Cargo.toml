[package]
name = "anchor-book"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Structured design records and validation for Anchor Books"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anchor-book/anchor-book"
readme = "README.md"
publish = false

[lib]
name = "anchor_book"

[[bin]]
name = "anchorbook"
path = "src/main.rs"

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
toml_edit = { version = "0.25.6", default-features = false, features = ["parse", "serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
