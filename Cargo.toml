[package]
name = "anchor-book"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Structured design records and validation for Anchor Books"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anchor-book/anchor-book"
readme = "README.md"
documentation = "https://docs.rs/anchor-book"
homepage = "https://anchor-book.github.io/anchor-book/"
keywords = ["documentation", "design", "verification", "mdbook"]
categories = ["development-tools", "command-line-utilities"]
publish = ["crates-io"]
exclude = ["/verification/"]

[lib]
name = "anchor_book"

[[bin]]
name = "anchorbook"
path = "src/main.rs"

[dependencies]
mdbook-summary = "=0.5.4"
mdbook-core = "=0.5.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25.6", default-features = false, features = ["parse", "serde"] }
# Rust source parsing for evidence links: items, attributes, and line positions only.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(anchorbook_verification)'] }

[lints.clippy]
all = "warn"

[dev-dependencies]
percent-encoding = "2.3"
scraper = { version = "0.24", default-features = false }
url = "2.5"
