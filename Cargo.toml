[package]
name = "anchor-book"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Structured design records and validation for Anchor Books"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anchor-book/anchor-book"
readme = "README.md"
publish = false

[lib]
name = "anchor_book"

[[bin]]
name = "anchorbook"
path = "src/main.rs"

[dependencies]
mdbook-summary = "=0.5.2"
mdbook-core = "=0.5.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25.6", default-features = false, features = ["parse", "serde"] }
vstd = "=0.0.0-2026-10-18-0147"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[lints.clippy]
all = "warn"

[dev-dependencies]
percent-encoding = "2.3"
scraper = { version = "0.24", default-features = false }
url = "2.5"

[package.metadata.verus]
verify = true
